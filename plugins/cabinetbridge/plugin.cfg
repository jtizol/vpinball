[configuration]
id = "CabinetBridge"
name = "Cabinet Bridge"
description = "Forwards live PinMAME switch/lamp/solenoid/GI/mech state to the pinball_cab dashboard's cabinet event bus over HTTP (localhost only)"
author = "pinball_cab"
version = "1.0"
link = ""

[libraries]
windows.x86 = "plugin-cabinetbridge.dll"
windows.x64 = "plugin-cabinetbridge64.dll"
linux.x64 = "plugin-cabinetbridge.so"
linux.aarch64 = "plugin-cabinetbridge.so"
macos.x64 = "plugin-cabinetbridge.dylib"
macos.arm64 = "plugin-cabinetbridge.dylib"
